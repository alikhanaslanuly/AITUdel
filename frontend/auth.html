<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AITUdel — Вход</title>
  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="emoji">🍔</span>
      <span style="color:var(--yellow)">AITU</span>del
    </div>
    <div class="auth-subtitle">Доставка еды для студентов AITU</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Войти</div>
      <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Регистрация</div>
    </div>

    <div id="alert-box"></div>

    <div id="form-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-blue" style="width:100%;margin-top:8px" onclick="doLogin()">Войти</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="reg-name" placeholder="Алихан Нурсултанов"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@aitu.edu.kz"/>
        <div class="hint blue">📧 Email @aitu.edu.kz — автоматически студент со скидкой 15%!</div>
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="reg-phone" placeholder="+7 777 000 00 00"/>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="Минимум 6 символов"/>
      </div>
      <div class="form-group">
        <label>Я хочу</label>
        <select id="reg-role">
          <option value="user">Заказывать еду</option>
          <option value="courier">Работать курьером</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doRegister()">Зарегистрироваться</button>
    </div>
  </div>
</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script>
  if (getUser()) window.location.href = "./index.html";

  function switchTab(tab) {
    document.getElementById("form-login").style.display = tab === "login" ? "block" : "none";
    document.getElementById("form-register").style.display = tab === "register" ? "block" : "none";
    document.getElementById("tab-login").className = "auth-tab" + (tab === "login" ? " active" : "");
    document.getElementById("tab-register").className = "auth-tab" + (tab === "register" ? " active" : "");
    document.getElementById("alert-box").innerHTML = "";
  }

  function showAlert(msg, type) {
    document.getElementById("alert-box").innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  async function doLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    if (!email || !password) { showAlert("Заполните все поля", "error"); return; }
    try {
      const data = await API.login({ email, password });
      saveUser(data);
      window.location.href = "./index.html";
    } catch (e) {
      showAlert(e.message, "error");
    }
  }

  async function doRegister() {
    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const phone = document.getElementById("reg-phone").value.trim();
    const password = document.getElementById("reg-password").value;
    const role = document.getElementById("reg-role").value;
    if (!name || !email || !password) { showAlert("Заполните все поля", "error"); return; }
    if (password.length < 6) { showAlert("Пароль минимум 6 символов", "error"); return; }
    try {
      const data = await API.register({ email, password, name, phone, role });
      saveUser(data);
      const isStudent = email.endsWith("@aitu.edu.kz");
      if (isStudent) {
        showAlert("🎓 Вы студент AITU! Промокод AITU2025 активирован — скидка 15%", "success");
      } else {
        showAlert("Добро пожаловать!", "success");
      }
      setTimeout(() => { window.location.href = "./index.html"; }, 1500);
    } catch (e) {
      showAlert(e.message, "error");
    }
  }
</script>
</body>
</html>
