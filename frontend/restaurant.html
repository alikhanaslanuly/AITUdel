<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AITUdel — Меню</title>
  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div id="rest-header" class="menu-header">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <div class="section-title">🍽️ Меню</div>
  <div id="menu-grid" class="menu-items-grid">
    <div class="loader"><div class="spinner"></div></div>
  </div>

  <div id="rate-section" style="display:none;margin-bottom:40px">
    <div class="section-title">⭐ Оставить отзыв</div>
    <div style="background:white;border-radius:12px;padding:20px;box-shadow:var(--shadow);max-width:400px">
      <div class="form-group">
        <label>Оценка</label>
        <select id="rate-value">
          <option value="5">⭐⭐⭐⭐⭐ Отлично</option>
          <option value="4">⭐⭐⭐⭐ Хорошо</option>
          <option value="3">⭐⭐⭐ Нормально</option>
          <option value="2">⭐⭐ Плохо</option>
          <option value="1">⭐ Ужасно</option>
        </select>
      </div>
      <div class="form-group">
        <label>Комментарий</label>
        <input type="text" id="rate-comment" placeholder="Ваш отзыв..."/>
      </div>
      <button class="btn btn-primary" onclick="doRate()">Отправить отзыв</button>
    </div>
  </div>
</div>

<footer class="footer"><strong>AITUdel</strong> — Сделано студентами AITU ❤️</footer>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/restaurant.js"></script>
</body>
</html>
