server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: aitudel-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: aitudel
          __path__: /var/log/aitudel/*.log