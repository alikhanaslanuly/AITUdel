global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'microservices'
    static_configs:
      - targets: 
        - 'api-gateway:8080'
        - 'user-service:50051'
        - 'order-service:50052'
        - 'restaurant-service:50053'
